[package]
name = "agent-wallet"
version = "0.1.0"
edition = "2021"
description = "AXON Protocol — cap-guarded agent wallet for Stellar (Soroban)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22"

[profile.release]
overflow-checks = true

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }
